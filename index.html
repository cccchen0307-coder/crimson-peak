<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crimson Peak｜緋紅之巔</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080709;color:#eee1d2;font-family:Arial,'Noto Sans TC',sans-serif}button,select{font:inherit;cursor:pointer}.hidden{display:none!important}.screen{min-height:100vh}.title-screen{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse,#4a0b18,#080709 70%)}h1{font:700 clamp(48px,8vw,100px) Georgia,serif;letter-spacing:.12em;text-shadow:0 0 35px #bd2033;margin:10px}.eyebrow{letter-spacing:.3em;color:#c7a69f;font-size:12px}.cn{font-size:23px;letter-spacing:.7em;margin:25px 0}.copy{font:italic 22px Georgia,serif;color:#d0b8b1}.primary{margin:20px;padding:15px 44px;background:#a52b39;border:1px solid #e67a79;color:white;box-shadow:0 0 25px #8b1d2c}.options{color:#c3aeb0;font-size:13px}.topbar{height:64px;display:flex;align-items:center;gap:20px;padding:0 25px;background:#110d12;border-bottom:1px solid #53343e}.brand{font:bold 24px Georgia,serif}.brand span{color:#c33b48}.chapter{flex:1;text-align:center;color:#c8aeb1}.topbar button{background:#20151b;border:1px solid #65404a;color:#ead4ce;padding:6px 10px}.layout{display:grid;grid-template-columns:1fr 290px;min-height:calc(100vh - 64px)}.main{padding:25px;max-width:1100px;width:100%;margin:auto}.scene{height:60vh;min-height:360px;position:relative;overflow:hidden;border:1px solid #6d3945;background:radial-gradient(ellipse at center,#541321,#171017 42%,#08090b 80%);box-shadow:0 20px 50px #000}.scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(120deg,#ffffff05 0 1px,transparent 1px 9px);animation:flicker 6s infinite}.scene:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 25%,#000b 100%);pointer-events:none}.scene.archive{background:linear-gradient(90deg,#3a2529,#161019 20% 80%,#3a2529)}.scene.lab{background:radial-gradient(circle,#71182b,#21101b 38%,#08090b 75%)}.scene.shop{background:linear-gradient(100deg,#351d34,#110d19 50%,#341421)}.scene.void{background:radial-gradient(ellipse,#94152c,#270b19 35%,#050507 75%)}@keyframes flicker{50%{opacity:.35}}.hotspots{position:absolute;inset:0;z-index:2}.hotspot{position:absolute;background:#160e15dd;border:1px solid #a46b75;color:#f1ddd4;padding:10px 13px}.hotspot:hover{background:#9b2333;transform:scale(1.04)}.caption{position:absolute;z-index:3;bottom:18px;left:20px;font:24px Georgia,serif}.message{background:#161117;border:1px solid #53343e;padding:14px;min-height:85px}.speaker{color:#dc5360;font-size:12px}.message p{line-height:1.8;margin:7px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}.choice{background:#251820;border:1px solid #71424c;color:#f1ddd4;padding:9px 13px}.side{padding:20px;background:#110e13;border-left:1px solid #53343e}.tabs{display:flex;border-bottom:1px solid #53343e}.tab{background:none;border:0;color:#ad9297;padding:10px}.tab.active{color:white;border-bottom:2px solid #c03443}.item,.note{padding:10px 0;border-bottom:1px solid #33242c;font-size:12px}.item small{display:block;color:#958187;margin-top:4px}.goal{margin-top:35vh;border-top:1px solid #53343e;padding-top:15px;color:#d8c0bb;font-size:13px}.modal{position:fixed;inset:0;background:#000d;z-index:5;display:grid;place-items:center;padding:20px}.card{position:relative;background:#1c141b;border:1px solid #874452;max-width:580px;width:100%;padding:28px;box-shadow:0 20px 80px #000}.card h2{font:26px Georgia,serif;color:#e6c5bf}.close{position:absolute;right:10px;top:7px;background:none;border:0;color:#c9a2a5;font-size:25px}.end{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse,#4a0c1a,#080709 70%)}
@media(max-width:700px){.layout{display:block}.side{border-left:0;border-top:1px solid #53343e}.goal{margin-top:30px}.topbar{padding:0 10px;gap:5px}.brand{font-size:17px}.chapter{font-size:10px}}
</style></head>
<body>
<section id="title" class="screen title-screen"><p class="eyebrow">A PSYCHOLOGICAL MYSTERY</p><h1>CRIMSON PEAK</h1><p class="cn">緋紅之巔</p><p class="copy">願望不會消失，只是換了一種形式。</p><button id="start" class="primary">開始調查</button><div class="options">難度 <select id="difficulty"><option>簡單</option><option selected>中等</option><option>困難</option></select>　<label><input id="cheat" type="checkbox"> 輔助模式</label></div><p class="eyebrow">2D 點擊式解謎・五章 Demo</p></section>
<section id="game" class="screen hidden"><header class="topbar"><div class="brand">CRIMSON <span>PEAK</span></div><div id="chapter" class="chapter"></div><button id="save">保存</button><button id="load">讀取</button><button id="mute">♫ 音效</button></header><div class="layout"><main class="main"><div id="scene" class="scene"><div id="hotspots" class="hotspots"></div><div id="caption" class="caption"></div></div><div class="message"><span id="speaker" class="speaker">尤里</span><span id="progress" style="float:right">1 / 5</span><p id="message"></p></div><div id="actions" class="actions"></div></main><aside class="side"><div class="tabs"><button class="tab active" data-tab="items">道具</button><button class="tab" data-tab="notes">線索 <b id="count">0</b></button></div><div id="items"></div><div id="notes" class="hidden"></div><div class="goal">目前目標<br><strong id="goal"></strong></div></aside></div></section>
<section id="ending" class="screen end hidden"><p class="eyebrow">THE END</p><h1 id="endTitle"></h1><p id="endText" style="max-width:560px;line-height:2"></p><p id="summary" class="eyebrow"></p><button id="again" class="primary">再次調查</button></section>
<div id="modal" class="modal hidden"><div class="card"><button id="close" class="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(function(){'use strict';
const q=s=>document.querySelector(s), state={chapter:1,items:[],notes:[],flags:{},difficulty:'中等',cheat:false,sound:true};
const chapters={1:['CHAPTER 01｜消失之物','奧里克斯的房間','調查祖父的房間',''],2:['CHAPTER 02｜願望的記錄','舊檔案館','整理三份願望檔案','archive'],3:['CHAPTER 03｜紅色痕跡','廢棄研究場所','重建紅色符號順序','lab'],4:['CHAPTER 04｜替代品','沒有出口的商店','辨認契約條件','shop'],5:['CHAPTER 05｜緋紅之巔','願望的空間','理解並作出選擇','void']};
function save(){localStorage.setItem('crimson-peak-save',JSON.stringify(state))}function addNote(x){if(!state.notes.includes(x)){state.notes.push(x);render();save()}}function addItem(n,d){if(!state.items.some(x=>x[0]===n)){state.items.push([n,d]);render();save()}}
function say(t,sp='尤里',buttons=[]){q('#speaker').textContent=sp;q('#message').textContent=t;q('#actions').innerHTML='';buttons.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x[0];b.onclick=x[1];q('#actions').appendChild(b)})}
function modal(title,html){q('#modalTitle').textContent=title;q('#modalBody').innerHTML=html;q('#modal').classList.remove('hidden')}
function close(){q('#modal').classList.add('hidden')}
function setHotspots(list){q('#hotspots').innerHTML='';list.forEach(x=>{const b=document.createElement('button');b.className='hotspot';b.textContent=x[0];b.style.left=x[1]+'%';b.style.top=x[2]+'%';b.onclick=x[3];q('#hotspots').appendChild(b)})}
function enter(n){state.chapter=n;const c=chapters[n];q('#chapter').textContent=c[0];q('#caption').textContent=c[1];q('#goal').textContent=c[2];q('#progress').textContent=n+' / 5';q('#scene').className='scene '+c[3];render();[one,two,three,four,five][n-1]();save()}
function sequence(title,buttons,answer,done){modal(title,'<p>請依照線索排列正確順序。</p><div id="puzzle" class="actions"></div><p id="result"></p>');let got=[];const box=q('#puzzle');buttons.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x[0];b.dataset.v=x[1];b.onclick=()=>{got.push(b.dataset.v);b.disabled=true;if(got.length===answer.length){if(got.join('')===answer||state.cheat){q('#result').textContent='正確，隱藏機關已解除。';done()}else{q('#result').textContent='順序不對，請重新推理。';got=[];box.querySelectorAll('button').forEach(z=>z.disabled=false)}}};box.appendChild(b)})}
function one(){setHotspots([['祖父',10,45,()=>{say('「いなくなった……消失了……」他盯著腳踝。','奧里克斯');addNote('祖父反覆說「消失了」。')}],['腳踝紅痕',25,70,()=>{modal('紅色痕跡','像一個沒有閉合的圓環。');addNote('紅痕與圓環符號相關。')}],['散落古書',43,35,()=>modal('書頁','「先記錄願望，再記錄交換，最後記錄消失。」')],['不對齊書架',82,22,()=>sequence('被移動的書',[['願望','A'],['交換','C'],['消失','D']],'ACD',()=>{state.flags.book=true;addItem('舊鑰匙','開啟書桌抽屜');addNote('書架順序是願望→交換→消失');close();enter(2)})],['書桌',70,53,()=>{if(!state.flags.book)say('抽屜鎖住了。');else{addItem('祖父研究筆記','創造、貪求與再現');say('燈光熄滅。黑暗裡有一隻眼睛。', '未知', [['進入下一章',()=>enter(2)]])}}]]);say('房間裡瀰漫著灰塵。祖父又在說那句話。')}
function two(){setHotspots([['借閱紀錄',12,25,()=>{modal('時間線','A｜1891、B｜1887、C｜1896。不要按年齡排列。');addNote('檔案時間順序是 B→A→C。')}],['三份檔案',42,38,()=>sequence('檔案時間線',[['B｜1887','B'],['A｜1891','A'],['C｜1896','C']],'BAC',()=>{state.flags.archive=true;addNote('表面沒有獲得，不代表願望沒有被回應');close();enter(3)})],['鎖住櫃子',76,62,()=>{if(state.flags.archive){addItem('願望紀錄','三個願望案例');say('櫃中找到通往研究場所的地圖。')}else say('先整理檔案。')}]]);say('檔案館沒有窗戶。灰塵在沒有風的地方移動。')}
function three(){setHotspots([['入口符號',12,30,()=>{addNote('入口符號代表召喚。');say('紅色圓環缺了一角。')}],['研究報告',38,23,()=>{addNote('試圖控制會使願望不穩定。');modal('錄音','「它一直在理解我們。」')}],['地下觀察室',63,52,()=>sequence('紅色符號',[['召喚','召喚'],['交換','交換'],['消失','消失']],'召喚交換消失',()=>{addNote('祖父曾參與固定實驗。');close();enter(4)})],['研究識別證',82,72,()=>addItem('研究識別證','進入地下觀察室')]]);say('廢棄設施的電力已切斷，紅光卻在地下脈動。')}
function four(){setHotspots([['名字展示櫃',15,34,()=>modal('被遺忘的名字','玻璃裡沒有紙條，只有一個你想不起來的名字。')],['記憶展示櫃',40,34,()=>modal('模糊記憶','你看見祖父觸碰紅光，卻不確定自己是否在場。')],['契約展示櫃',65,34,()=>sequence('契約條件',[['模糊承諾','wrong'],['明確交換','right']],'right',()=>{state.flags.contract=true;addNote('明確說出的交換才成立。');close()})],['商人',82,70,()=>say('有些存在遵守寫下的條件，有些只遵守自己理解的願望。','商人',[['拒絕交易',()=>{state.flags.refused=true;enter(5)}],['接受交易',()=>{state.flags.traded=true;addItem('不完整契約','商人的交換規則');enter(5)}]])]);say('商店沒有出口。貨架上的物品像從別人的夢裡取出。')}
function five(){setHotspots([['反覆書架',15,25,()=>modal('循環','願望、交換、消失。它們沒有消失，只換了位置。')],['沒有倒影的鏡子',40,25,()=>{addNote('Crimson Peak 可能不是一個可定位的地方。');say('鏡中沒有你，只有一隻慢慢睜開的眼睛。')}],['研究桌',70,30,()=>modal('最終推理','<div class="actions"><button class="choice" data-w="control">控制所有願望</button><button class="choice" data-w="understand">理解它為何出現</button><button class="choice" data-w="memory">恢復失去的記憶</button></div>')],['深紅色眼睛',51,62,()=>sequence('願望循環',[['創造','1'],['貪求','2'],['消失','3'],['再現','4']],'1234',()=>{close();finish()})]]);say('房間回到原處，又不像原來。門通往同一扇門。');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{state.flags.wish=b.dataset.w;addNote('你的推理：'+b.textContent);close()})}
function finish(){modal('最後的選擇','<p>你要如何對待這個循環？</p><div class="actions"><button class="choice" data-e="cut">切斷交換</button><button class="choice" data-e="continue">讓交換繼續</button><button class="choice" data-e="understand">承認無法理解</button><button class="choice" data-e="secret">以自己的願望交換</button></div>');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>ending(b.dataset.e))}
function ending(k){close();q('#game').classList.add('hidden');q('#ending').classList.remove('hidden');let d={cut:['ENDING A｜切斷交換','你燒掉召喚記錄。眼睛閉合了，但紅痕沒有消失。'],continue:['ENDING B｜願望仍在繼續','你把研究放回書架。城市角落逐一亮起深紅色眼睛。'],understand:['ENDING C｜緋紅之巔並不在遠方','你承認它無法被善惡或控制定義。'],secret:['ENDING D｜交換者','你說出自己的願望，祖父醒來，而你的名字從記錄中消失。']}[k];q('#endTitle').textContent=d[0];q('#endText').textContent=d[1];q('#summary').textContent='難度：'+state.difficulty+'｜線索：'+state.notes.length;save()}
function render(){q('#items').innerHTML=state.items.length?state.items.map(x=>'<div class="item"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>').join(''):'<p class="item-desc">尚未取得道具。</p>';q('#notes').innerHTML=state.notes.length?state.notes.map(x=>'<div class="note">'+x+'</div>').join(''):'<p>尚未發現線索。</p>';q('#count').textContent=state.notes.length}
function start(){state.chapter=1;state.items=[];state.notes=[];state.flags={};state.difficulty=q('#difficulty').value;state.cheat=q('#cheat').checked;q('#title').classList.add('hidden');q('#game').classList.remove('hidden');enter(1)}
q('#start').addEventListener('click',start);q('#save').addEventListener('click',save);q('#load').addEventListener('click',()=>{const x=localStorage.getItem('crimson-peak-save');if(!x){alert('沒有保存檔');return}Object.assign(state,JSON.parse(x));q('#title').classList.add('hidden');q('#game').classList.remove('hidden');enter(state.chapter)});q('#close').addEventListener('click',close);q('#modal').addEventListener('click',e=>{if(e.target===q('#modal'))close()});q('#mute').addEventListener('click',()=>{state.sound=!state.sound;q('#mute').textContent=state.sound?'♫ 音效':'♪ 靜音'});q('#again').addEventListener('click',()=>{q('#ending').classList.add('hidden');q('#title').classList.remove('hidden')});document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');q('#items').classList.toggle('hidden',t.dataset.tab!=='items');q('#notes').classList.toggle('hidden',t.dataset.tab!=='notes')}));
})();
</script></body></html>
